<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>

<!-- Preconnect to Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Async font loading: Inter, Roboto, Fira Code -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@700;900&family=Fira+Code:wght@400;500&display=swap"
  media="print"
  onload="this.media='all'"
/>
<noscript>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@700;900&family=Fira+Code:wght@400;500&display=swap"
  />
</noscript>

<!-- Compiled Tailwind CSS -->
<link rel="stylesheet" href="/css/style.css" />

<!-- Custom utilities for navigation, certifications, and button effects -->
<style>
  /* Layout utilities */
  .sticky { position: sticky; }
  .top-0 { top: 0; }
  .z-40 { z-index: 40; }
  .z-50 { z-index: 50; }
  .hidden { display: none; }
  .grid { display: grid; }
  .justify-between { justify-content: space-between; }
  .overflow-hidden { overflow: hidden; }
  .flex-shrink-0 { flex-shrink: 0; }
  .items-end { align-items: flex-end; }

  /* Grid columns */
  .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }

  /* Sizing */
  .w-0 { width: 0; }
  .w-6 { width: calc(var(--spacing) * 6); }
  .w-12 { width: calc(var(--spacing) * 12); }
  .h-0\.5 { height: calc(var(--spacing) * 0.5); }
  .h-6 { height: calc(var(--spacing) * 6); }
  .h-12 { height: calc(var(--spacing) * 12); }
  .p-2 { padding: calc(var(--spacing) * 2); }
  .py-3 { padding-block: calc(var(--spacing) * 3); }
  .gap-4 { gap: calc(var(--spacing) * 4); }

  /* Borders */
  .border { border-style: var(--tw-border-style); border-width: 1px; }
  .border-slate-700\/50 { border-color: color-mix(in oklab, var(--color-slate-700) 50%, transparent); }
  .border-slate-800\/50 { border-color: color-mix(in oklab, var(--color-slate-800) 50%, transparent); }
  .border-amber-600\/50 { border-color: color-mix(in oklab, var(--color-amber-600) 50%, transparent); }
  .border-amber-600 { border-color: var(--color-amber-600); }

  /* Backgrounds */
  .bg-slate-900\/95 { background-color: color-mix(in oklab, var(--color-slate-900) 95%, transparent); }
  .bg-slate-800\/30 { background-color: color-mix(in oklab, var(--color-slate-800) 30%, transparent); }
  .bg-slate-900\/80 { background-color: color-mix(in oklab, var(--color-slate-900) 80%, transparent); }
  .text-amber-600\/80 { color: color-mix(in oklab, var(--color-amber-600) 80%, transparent); }

  /* Backdrop blur */
  .backdrop-blur-sm { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

  /* Transitions */
  .duration-300 { transition-duration: 300ms; }
  .transition-all {
    transition-property: all;
    transition-timing-function: var(--default-transition-timing-function);
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }
  .transition-transform {
    transition-property: transform, translate, scale, rotate;
    transition-timing-function: var(--default-transition-timing-function);
    transition-duration: var(--tw-duration, var(--default-transition-duration));
  }

  /* Group hover effects */
  .group:hover .group-hover\:text-amber-600 { color: var(--color-amber-600); }
  .group:hover .group-hover\:border-amber-600\/50 { border-color: color-mix(in oklab, var(--color-amber-600) 50%, transparent); }
  .group:hover .group-hover\:border-amber-600\/30 { border-color: color-mix(in oklab, var(--color-amber-600) 30%, transparent); }
  .group:hover .group-hover\:w-3\/4 { width: 75%; }
  .group:hover .group-hover\:translate-x-1 { transform: translateX(calc(var(--spacing) * 1)); }

  /* Hover states */
  @media (hover: hover) {
    .hover\:bg-amber-600\/10:hover { background-color: color-mix(in oklab, var(--color-amber-600) 10%, transparent); }
    .hover\:bg-amber-600:hover { background-color: var(--color-amber-600); }
    .hover\:bg-slate-800\/50:hover { background-color: color-mix(in oklab, var(--color-slate-800) 50%, transparent); }
    .hover\:border-amber-500:hover { border-color: var(--color-amber-500); }
    .hover\:border-amber-600:hover { border-color: var(--color-amber-600); }
    .hover\:text-slate-900:hover { color: var(--color-slate-900); }
    .hover\:-translate-y-0\.5:hover { transform: translateY(calc(var(--spacing) * -0.5)); }
    .hover\:shadow-lg:hover {
      --tw-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow);
    }
    .hover\:shadow-amber-600\/25:hover { --tw-shadow-color: color-mix(in oklab, var(--color-amber-600) 25%, transparent); }
    .hover\:shadow-amber-600\/5:hover { --tw-shadow-color: color-mix(in oklab, var(--color-amber-600) 5%, transparent); }
  }

  /* Responsive */
  @media (min-width: 48rem) {
    .md\:flex { display: flex; }
    .md\:hidden { display: none; }
    .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 64rem) {
    .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* Additional sizing */
  .w-2 { width: calc(var(--spacing) * 2); }
  .w-5 { width: calc(var(--spacing) * 5); }
  .w-10 { width: calc(var(--spacing) * 10); }
  .h-2 { height: calc(var(--spacing) * 2); }
  .h-10 { height: calc(var(--spacing) * 10); }
  .p-3 { padding: calc(var(--spacing) * 3); }
  .ml-auto { margin-left: auto; }

  /* Spacing */
  .space-y-4 > * + * { margin-top: calc(var(--spacing) * 4); }

  /* Typography */
  .uppercase { text-transform: uppercase; }
  .tracking-wider { letter-spacing: 0.05em; }

  /* Colors */
  .bg-green-500 { background-color: oklch(72.3% .219 149.579); }
  .bg-slate-900\/50 { background-color: color-mix(in oklab, var(--color-slate-900) 50%, transparent); }
  .border-slate-700 { border-color: var(--color-slate-700); }

  /* Grid span */
  @media (min-width: 48rem) {
    .md\:col-span-2 { grid-column: span 2 / span 2; }
  }

  /* Group hover — reverse translate */
  .group:hover .group-hover\:-translate-x-1 { transform: translateX(calc(var(--spacing) * -1)); }

  /* Flex wrap for footer */
  .flex-wrap { flex-wrap: wrap; }

  /* Certification card sizing */
  .w-8 { width: calc(var(--spacing) * 8); }
  .h-8 { height: calc(var(--spacing) * 8); }
  .w-16 { width: calc(var(--spacing) * 16); }
  .h-16 { height: calc(var(--spacing) * 16); }
  .w-3\.5 { width: calc(var(--spacing) * 3.5); }
  .h-3\.5 { height: calc(var(--spacing) * 3.5); }
  .min-w-0 { min-width: 0; }
  .gap-1\.5 { gap: calc(var(--spacing) * 1.5); }
  .gap-3 { gap: calc(var(--spacing) * 3); }
  .py-0\.5 { padding-block: calc(var(--spacing) * 0.5); }
  .py-1\.5 { padding-block: calc(var(--spacing) * 1.5); }
  .pt-4 { padding-top: calc(var(--spacing) * 4); }
  .mt-4 { margin-top: calc(var(--spacing) * 4); }
  .p-1 { padding: calc(var(--spacing) * 1); }
  .object-contain { object-fit: contain; }
  .leading-tight { line-height: 1.25; }
  .border-t { border-top-style: var(--tw-border-style); border-top-width: 1px; }
  .border-slate-700\/30 { border-color: color-mix(in oklab, var(--color-slate-700) 30%, transparent); }

  /* Cert status badges */
  .cert-status-active {
    background-color: color-mix(in oklab, oklch(72.3% .219 149.579) 15%, transparent);
    color: oklch(72.3% .219 149.579);
    border: 1px solid color-mix(in oklab, oklch(72.3% .219 149.579) 30%, transparent);
  }
  .cert-status-expired {
    background-color: color-mix(in oklab, oklch(63.7% .237 25.331) 15%, transparent);
    color: oklch(63.7% .237 25.331);
    border: 1px solid color-mix(in oklab, oklch(63.7% .237 25.331) 30%, transparent);
  }

  /* Expired card subtle dimming */
  .cert-expired { opacity: 0.75; }
  .cert-expired:hover { opacity: 1; }

  /* Cert button — verify/credential */
  .cert-btn-verify {
    color: var(--color-amber-600);
    border: 1px solid color-mix(in oklab, var(--color-amber-600) 50%, transparent);
    background-color: transparent;
  }
  @media (hover: hover) {
    .cert-btn-verify:hover {
      background-color: var(--color-amber-600);
      color: var(--color-slate-900);
      border-color: var(--color-amber-600);
    }
  }

  /* Cert button — PDF download */
  .cert-btn-pdf {
    color: var(--color-slate-300);
    border: 1px solid color-mix(in oklab, var(--color-slate-700) 50%, transparent);
    background-color: transparent;
  }
  @media (hover: hover) {
    .cert-btn-pdf:hover {
      background-color: color-mix(in oklab, var(--color-slate-700) 30%, transparent);
      color: var(--color-amber-600);
      border-color: color-mix(in oklab, var(--color-amber-600) 50%, transparent);
    }
  }

  /* Travel page */
  .aspect-square { aspect-ratio: 1 / 1; }
  .aspect-4-3 { aspect-ratio: 4 / 3; }
  .travel-card img { transition: transform 0.5s ease; }
  .travel-card:hover img { transform: scale(1.1); }
  .bg-gradient-to-t { background-image: linear-gradient(to top, var(--tw-gradient-stops)); }
  .from-slate-900\/90 { --tw-gradient-from: color-mix(in oklab, var(--color-slate-900) 90%, transparent); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, transparent); }
  .via-slate-900\/20 { --tw-gradient-via: color-mix(in oklab, var(--color-slate-900) 20%, transparent); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-via), var(--tw-gradient-to, transparent); }
  .to-transparent { --tw-gradient-to: transparent; }
  .opacity-0 { opacity: 0; }
  .transition-opacity { transition-property: opacity; transition-timing-function: var(--default-transition-timing-function); transition-duration: var(--default-transition-duration); }
  .group:hover .group-hover\:opacity-100 { opacity: 1; }
  .group:hover .group-hover\:scale-110 { transform: scale(1.1); }
  .inset-0 { inset: 0; }
  .w-32 { width: calc(var(--spacing) * 32); }
  .h-32 { height: calc(var(--spacing) * 32); }

  /* Travel grid responsive */
  .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 40rem) {
    .sm\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sm\:flex-row { flex-direction: row; }
    .sm\:w-40 { width: calc(var(--spacing) * 40); }
    .sm\:h-40 { height: calc(var(--spacing) * 40); }
    .sm\:mx-0 { margin-inline: 0; }
  }
  @media (min-width: 48rem) {
    .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (min-width: 64rem) {
    .lg\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }

  /* Leaflet map marker override */
  .travel-marker { background: transparent !important; border: none !important; }

  /* Nav underline — perfectly centered */
  .nav-underline {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-color: var(--color-amber-600);
    margin: 0 auto;
    width: 0;
    transition: width 0.3s ease;
  }
  .group:hover .nav-underline {
    width: 75%;
  }

  /* Smooth scroll */
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
</style>

<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
