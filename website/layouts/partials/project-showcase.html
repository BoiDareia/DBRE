{{/* Project Showcase section — CSS columns masonry layout */}}
<section id="projects" class="py-16 sm:py-20 md:py-28">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

    {{/* Section heading */}}
    <h2 class="text-white font-heading text-3xl sm:text-4xl md:text-5xl font-bold text-center mb-12 md:mb-16">
      Projects
    </h2>

    {{/* Masonry container using CSS columns */}}
    <div class="columns-1 md:columns-2 lg:columns-3 gap-6">
      {{ $projects := sort (where .Site.RegularPages "Section" "projects") "Weight" }}
      {{ range $projects }}
        {{ partial "project-card.html" . }}
      {{ end }}
    </div>

  </div>
</section>
