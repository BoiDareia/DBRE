{{ define "main" }}
<section class="py-16 sm:py-20 md:py-28">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-white font-heading text-3xl sm:text-4xl md:text-5xl font-bold text-center mb-12 md:mb-16">
      {{ .Title }}
    </h1>
    {{ .Content }}
    {{ range .Pages }}
      <div class="mb-8">
        <h2 class="text-white font-heading text-xl font-bold mb-2">
          <a href="{{ .Permalink }}" class="hover:text-amber-600 transition-colors">{{ .Title }}</a>
        </h2>
        {{ with .Params.summary }}
          <p class="text-slate-300 text-sm">{{ . }}</p>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
{{ end }}
