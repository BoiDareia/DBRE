{{ define "main" }}
<article class="py-16 sm:py-20 md:py-28">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-white font-heading text-3xl sm:text-4xl md:text-5xl font-bold mb-8">
      {{ .Title }}
    </h1>
    <div class="text-slate-300 text-base sm:text-lg leading-relaxed prose prose-invert max-w-none">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
