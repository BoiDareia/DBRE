# This AWS SAM template has been generated from your function's
# configuration. If your function has one or more triggers, note
# that the AWS resources associated with these triggers aren't fully
# specified in this template and include placeholder values.Open this template
# in AWS Application Composer or your favorite IDE and modify
# it to specify a serverless application with other AWS resources.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Specification template describing your function.
Resources:
  DBACortexScorecards:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: ""
      MemorySize: 128
      Timeout: 180
      Handler: app.lambda_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      EphemeralStorage:
        Size: 512
      Layers:
        - arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p310-boto3:4
        - arn:aws:lambda:us-east-1:770693421928:layer:Klayers-p310-requests:4
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      PackageType: Zip
      Tags:
        team: dba
      Policies:
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:*:account-number:secret:*
          - Action:
              - secretsmanager:GetSecretValue
            Effect: Allow
            Resource: arn:aws:secretsmanager:*:account-number:secret:slack-token-*
            Sid: SecretManagerAccess
          - Action:
              - pi:GetResourceMetrics
            Effect: Allow
            Resource: arn:aws:pi:*:*:metrics/rds/*
            Sid: PerformanceInsightsResourceMetricsAccess
          - Action:
              - cloudwatch:*
              - logs:*
              - sns:*
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetRole
            Effect: Allow
            Resource: "*"
            Sid: CloudWatchAccess
          - Action:
              - rds:Describe*
              - rds:ListTagsForResource
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcAttribute
              - ec2:DescribeVpcs
            Effect: Allow
            Resource: "*"
            Sid: AmazonRDSReadOnlyAccess
          - Action:
              - forecast:Create*
              - forecast:Describe*
              - forecast:Get*
              - forecast:List*
            Effect: Allow
            Resource: "*"
            Sid: ForecastAccess
          - Action:
              - iam:PassRole
            Effect: Allow
            Resource:
              - arn:aws:iam::account-number:role/DBA-Forecast
            Sid: ForecastIAMPassRole
          - Action:
              - s3:List*
              - s3:Get*
              - s3:Put*
            Effect: Allow
            Resource:
              - arn:aws:s3:::*forecast-capacity*/*
              - arn:aws:s3:::*forecast-capacity*
            Sid: S3Access
          - Effect: Allow
            Action:
              - autoscaling:Describe*
              - cloudwatch:*
              - logs:*
              - sns:*
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetRole
              - oam:ListSinks
            Resource: "*"
          - Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: >-
              arn:aws:iam::*:role/aws-service-role/events.amazonaws.com/AWSServiceRoleForCloudWatchEvents*
            Condition:
              StringLike:
                iam:AWSServiceName: events.amazonaws.com
          - Effect: Allow
            Action:
              - oam:ListAttachedLinks
            Resource: arn:aws:oam:*:*:sink/*
          - Effect: Allow
            Action:
              - rds:Describe*
              - rds:ListTagsForResource
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcAttribute
              - ec2:DescribeVpcs
            Resource: "*"
          - Effect: Allow
            Action:
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricData
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - devops-guru:GetResourceCollection
            Resource: "*"
          - Action:
              - devops-guru:SearchInsights
              - devops-guru:ListAnomaliesForInsight
            Effect: Allow
            Resource: "*"
            Condition:
              ForAllValues:StringEquals:
                devops-guru:ServiceNames:
                  - RDS
              "Null":
                devops-guru:ServiceNames: "false"
